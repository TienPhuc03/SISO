name: Build Unsigned iOS IPA (For Sideloadly)

on:
  push:
    branches:
      - dev
      - develop
      - main
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS .ipa on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # IPA chạy trên iPhone thật nên không dùng được localhost.
      # Đặt API_BASE_URL và SOCKET_URL tại: GitHub repo -> Settings ->
      # Secrets and variables -> Actions -> tab Variables.
      - name: Prepare Environment Configuration (.env)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SOCKET_URL: ${{ vars.SOCKET_URL }}
        run: |
          cp .env.example .env
          if [ -n "$API_BASE_URL" ]; then
            sed -i '' "s|^API_BASE_URL=.*|API_BASE_URL=$API_BASE_URL|" .env
          else
            echo "::warning::Chưa đặt biến API_BASE_URL, IPA sẽ gọi localhost (không chạy được trên iPhone)."
          fi
          if [ -n "$SOCKET_URL" ]; then
            sed -i '' "s|^SOCKET_URL=.*|SOCKET_URL=$SOCKET_URL|" .env
          else
            echo "::warning::Chưa đặt biến SOCKET_URL, IPA sẽ dùng localhost cho WebSocket."
          fi
          grep -E '^(API_BASE_URL|SOCKET_URL)=' .env

      # Xcode khai báo ios/Runner/GoogleService-Info.plist (FCM) nhưng file bị gitignore: thiếu là build lỗi.
      # Đặt Secret GOOGLE_SERVICE_INFO_PLIST (nội dung file mã hoá base64) tại: GitHub repo -> Settings ->
      # Secrets and variables -> Actions -> tab Secrets.
      - name: Prepare Firebase Configuration (GoogleService-Info.plist)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::error::Chưa đặt Secret GOOGLE_SERVICE_INFO_PLIST (base64 của GoogleService-Info.plist), Xcode không build được khi thiếu file này."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          # Plist của app Firebase khác (sai Bundle ID) vẫn build được nhưng không nhận thông báo: chặn sớm.
          bundle_id=$(plutil -extract BUNDLE_ID raw ios/Runner/GoogleService-Info.plist)
          if [ "$bundle_id" != "vn.edu.siso.sisoProject" ]; then
            echo "::error::GoogleService-Info.plist có BUNDLE_ID '$bundle_id', cần 'vn.edu.siso.sisoProject'."
            exit 1
          fi
          echo "Đã tạo GoogleService-Info.plist cho $bundle_id"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into Runner.ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y Runner.ipa Payload

      - name: Upload Runner.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SISO-Runner-IPA
          path: Runner.ipa
          retention-days: 14
