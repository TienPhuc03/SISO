name: Build Unsigned iOS IPA (For Sideloadly)

on:
  push:
    branches:
      - dev
      - develop
      - main
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS .ipa on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # IPA chạy trên iPhone thật nên không dùng được localhost.
      # Đặt API_BASE_URL và SOCKET_URL tại: GitHub repo -> Settings ->
      # Secrets and variables -> Actions -> tab Variables.
      - name: Prepare Environment Configuration (.env)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SOCKET_URL: ${{ vars.SOCKET_URL }}
        run: |
          cp .env.example .env
          if [ -n "$API_BASE_URL" ]; then
            sed -i '' "s|^API_BASE_URL=.*|API_BASE_URL=$API_BASE_URL|" .env
          else
            echo "::warning::Chưa đặt biến API_BASE_URL, IPA sẽ gọi localhost (không chạy được trên iPhone)."
          fi
          if [ -n "$SOCKET_URL" ]; then
            sed -i '' "s|^SOCKET_URL=.*|SOCKET_URL=$SOCKET_URL|" .env
          else
            echo "::warning::Chưa đặt biến SOCKET_URL, IPA sẽ dùng localhost cho WebSocket."
          fi
          grep -E '^(API_BASE_URL|SOCKET_URL)=' .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into Runner.ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y Runner.ipa Payload

      - name: Upload Runner.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SISO-Runner-IPA
          path: Runner.ipa
          retention-days: 14
